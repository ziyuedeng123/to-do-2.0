<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务清单 V5.2</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">📝 我的任务清单</h1>

    <!-- 添加任务 -->
    <section class="add-task">
      <input type="text" id="noInput" placeholder="编号 如 #001" aria-label="任务编号" maxlength="20" />
      <input type="text" id="taskInput" placeholder="请输入任务名称" aria-label="任务名称" />
      <button id="addBtn">添加任务</button>
      <p class="hint" id="hint"></p>
    </section>

    <!-- Tab -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="all">所有任务</button>
      <button class="tab" data-tab="todo">未完成</button>
      <button class="tab" data-tab="done">已完成</button>
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>

    <!-- 表格 -->
    <section class="table-wrap">
      <table class="task-table">
        <thead>
          <tr>
            <th class="col-no">
              <button
                id="sortNoBtn"
                class="sort-btn"
                data-sort="none"
                aria-label="按编号排序"
              >
                <span class="sort-label">编号</span>
                <span class="sort-icon" aria-hidden="true">↕</span>
              </button>
            </th>
            <th class="col-text">任务内容</th>
            <th class="col-status">状态</th>
            <th class="col-count">证据数</th>
            <th class="col-action">操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
  </main>

  <!-- 编辑任务浮层 -->
  <div id="editModal" class="modal" hidden>
    <div class="modal-content edit-modal">
      <h3>✏️ 编辑任务</h3>
      <div class="form-group">
        <label for="editNo">编号 <span class="required">*</span></label>
        <input type="text" id="editNo" placeholder="如 T-042" maxlength="20" />
      </div>
      <div class="form-group">
        <label for="editText">任务名称 <span class="required">*</span></label>
        <input type="text" id="editText" placeholder="请输入任务名称" />
      </div>
      <div class="form-group">
        <label for="editStatus">状态</label>
        <select id="editStatus">
          <option value="false">未完成</option>
          <option value="true">已完成</option>
        </select>
      </div>
      <div class="form-group">
        <label>证据图片（最多 9 张）</label>
        <div id="editDropZone" class="drop-zone">
          <p>📁 点击或拖拽图片到此处上传</p>
          <input type="file" id="editPhotoInput" accept="image/*" multiple hidden />
        </div>
        <div id="editPreviewList" class="preview-list"></div>
      </div>
      <p class="hint" id="editHint"></p>
      <div class="modal-actions">
        <button id="saveEdit" class="btn-primary">💾 保存</button>
        <button id="cancelEdit" class="btn-secondary">取消</button>
      </div>
    </div>
  </div>

  <!-- 图片预览浮层 -->
  <div id="imagePreview" class="modal" hidden>
    <div class="modal-content preview-content">
      <img id="previewImg" src="" alt="证据预览" />
      <button id="closePreview" class="btn-secondary">关闭</button>
    </div>
  </div>

  <!-- ✅ 关键修复：用绝对路径引用，确保 Vercel 能正确解析 -->
  <script src="/script.js"></script>
</body>
</html>
